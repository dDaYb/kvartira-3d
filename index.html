<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Квартира — 3D-модель</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.1/dist/model-viewer.min.js"></script>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: #f4f1eb;
    color: #1c1b19;
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: flex-end;
    padding: 18px 28px 12px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  p { margin: 0; color: #5c574e; font-size: 14px; line-height: 1.45; }
  a { color: #6d4c2a; }
  #status { text-align: right; font-size: 13px; color: #5c574e; max-width: 420px; }
  model-viewer {
    flex: 1;
    width: 100%;
    min-height: 420px;
    background: #ebe6dc;
  }
  footer {
    padding: 10px 28px 16px;
    font-size: 13px;
    color: #6d675e;
  }
  @media (max-width: 720px) {
    header { flex-direction: column; align-items: flex-start; padding: 16px; }
    #status { text-align: left; }
    footer { padding: 10px 16px 16px; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title">Квартира</h1>
    <p>Вращение — левая кнопка мыши, масштаб — колесо, сдвиг — правая кнопка или два пальца. <a href="свет.html">Выключатели и светильники по листу 10</a>.</p>
  </div>
  <p id="status">Загрузка сведений о модели…</p>
</header>
<model-viewer
  id="viewer"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="0.7"
  exposure="1.05"
  environment-image="neutral"
  alt="Промежуточная 3D-модель квартиры">
</model-viewer>
<footer id="note"></footer>
<script>
const status = document.getElementById("status");
const note = document.getElementById("note");
const title = document.getElementById("title");
const viewer = document.getElementById("viewer");

function showModel(version) {
  viewer.src = version
    ? "model/apartment.glb?v=" + encodeURIComponent(version)
    : "model/apartment.glb";
}

fetch("model/info.json", { cache: "no-store" })
  .then((response) => {
    if (!response.ok) throw new Error(String(response.status));
    return response.json();
  })
  .then((info) => {
    title.textContent = info.title || "Квартира";
    const when = info.exported ? info.exported.replace("T", " ") : "";
    const size = info.bytes ? Math.round(info.bytes / 1024 / 1024 * 10) / 10 + " МБ" : "";
    status.textContent = [when, info.source, size].filter(Boolean).join(" · ");
    note.textContent = info.note || "";
    showModel(info.exported || "");
  })
  .catch(() => {
    status.textContent = "Файл model/info.json не прочитан. Модель ниже берётся из model/apartment.glb.";
    showModel("");
  });

document.getElementById("viewer").addEventListener("error", () => {
  status.textContent = "Браузер не открыл model/apartment.glb.";
});
</script>
</body>
</html>
